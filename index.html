<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07080d">
  <title>VOID — Rust utility</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root { --bg:#07080d; --card:rgba(18,20,30,.68); --line:rgba(255,255,255,.09); --text:#f7f7fb; --muted:#9699a8; --violet:#8b5cf6; --cyan:#38bdf8; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; min-height:100vh; overflow-x:hidden; color:var(--text); background:var(--bg); font-family:Inter, sans-serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.25; z-index:10; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E"); }
    .orb { position:fixed; width:460px; height:460px; border-radius:50%; filter:blur(100px); opacity:.18; pointer-events:none; animation:drift 10s ease-in-out infinite alternate; }
    .orb.one { top:-170px; left:-120px; background:var(--violet); }
    .orb.two { right:-180px; bottom:-180px; background:var(--cyan); animation-delay:-4s; }
    @keyframes drift { to { transform:translate(60px, 45px) scale(1.12); } }

    nav { width:min(1180px, calc(100% - 40px)); height:84px; margin:auto; display:flex; align-items:center; justify-content:space-between; position:relative; z-index:20; }
    .logo { display:flex; align-items:center; gap:11px; font:700 20px/1 'Space Grotesk'; letter-spacing:.16em; }
    .logo-mark { width:31px; height:31px; display:grid; place-items:center; border:1px solid rgba(139,92,246,.65); background:rgba(139,92,246,.12); transform:rotate(45deg); box-shadow:0 0 28px rgba(139,92,246,.25); }
    .logo-mark span { transform:rotate(-45deg); color:#c4b5fd; }
    .nav-right { display:flex; align-items:center; gap:22px; }
    .status { color:var(--muted); font-size:13px; display:flex; align-items:center; gap:8px; }
    .status::before { content:""; width:7px; height:7px; border-radius:50%; background:#4ade80; box-shadow:0 0 12px #4ade80; }
    button, .button { border:0; color:inherit; font:600 14px/1 Inter; cursor:pointer; text-decoration:none; }
    .login { display:flex; align-items:center; gap:10px; padding:10px 15px; border:1px solid var(--line); border-radius:11px; background:rgba(255,255,255,.055); transition:.25s; }
    .login:hover { transform:translateY(-2px); background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.18); }
    .google { width:18px; height:18px; border-radius:50%; display:grid; place-items:center; background:#fff; color:#4285f4; font:bold 12px Arial; }

    main { width:min(1180px, calc(100% - 40px)); margin:auto; min-height:calc(100vh - 84px); display:grid; grid-template-columns:1.1fr .9fr; align-items:center; gap:70px; padding:55px 0 90px; position:relative; z-index:2; }
    .eyebrow { width:max-content; padding:8px 12px; border-radius:99px; border:1px solid rgba(139,92,246,.25); color:#c4b5fd; background:rgba(139,92,246,.08); font-size:12px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; animation:rise .7s both; }
    h1 { margin:24px 0 20px; max-width:760px; font:700 clamp(54px,7vw,92px)/.92 'Space Grotesk'; letter-spacing:-.06em; animation:rise .7s .1s both; }
    h1 span { color:transparent; -webkit-text-stroke:1px rgba(255,255,255,.55); }
    .lead { max-width:590px; margin:0; color:var(--muted); font-size:17px; line-height:1.75; animation:rise .7s .2s both; }
    .actions { display:flex; gap:13px; margin-top:34px; animation:rise .7s .3s both; }
    .download { position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:11px; padding:17px 24px; border-radius:13px; color:#fff; background:linear-gradient(135deg, #7c3aed, #4f46e5); box-shadow:0 15px 50px rgba(99,102,241,.28); transition:.25s; }
    .download::after { content:""; position:absolute; inset:-2px; transform:translateX(-110%) skewX(-18deg); background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent); transition:.55s; }
    .download:hover { transform:translateY(-3px); box-shadow:0 20px 60px rgba(99,102,241,.4); }
    .download:hover::after { transform:translateX(110%) skewX(-18deg); }
    .more { display:inline-flex; align-items:center; padding:17px 22px; border:1px solid var(--line); border-radius:13px; background:rgba(255,255,255,.04); transition:.25s; }
    .more:hover { background:rgba(255,255,255,.08); }
    @keyframes rise { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:none; } }

    .visual { position:relative; animation:rise .9s .2s both; }
    .panel { position:relative; min-height:490px; padding:22px; border:1px solid var(--line); border-radius:25px; background:linear-gradient(145deg,rgba(25,27,40,.82),rgba(10,11,17,.6)); box-shadow:0 35px 100px rgba(0,0,0,.38); backdrop-filter:blur(18px); transform:perspective(1000px) rotateY(-6deg) rotateX(3deg); transition:.35s; overflow:hidden; }
    .panel:hover { transform:perspective(1000px) rotateY(-2deg) rotateX(1deg) translateY(-5px); }
    .panel::before { content:""; position:absolute; width:250px; height:250px; border-radius:50%; top:70px; right:70px; background:rgba(124,58,237,.22); filter:blur(65px); }
    .panel-top { display:flex; justify-content:space-between; align-items:center; color:#727586; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    .dots { display:flex; gap:6px; } .dots i { width:7px; height:7px; border-radius:50%; background:#333644; } .dots i:first-child { background:#8b5cf6; }
    .crosshair { width:220px; height:220px; margin:65px auto 35px; display:grid; place-items:center; position:relative; border:1px solid rgba(139,92,246,.13); border-radius:50%; box-shadow:0 0 0 35px rgba(139,92,246,.035),0 0 0 70px rgba(139,92,246,.018); }
    .crosshair::before,.crosshair::after { content:""; position:absolute; background:linear-gradient(90deg,transparent,#8b5cf6,transparent); }
    .crosshair::before { width:280px; height:1px; } .crosshair::after { height:280px; width:1px; background:linear-gradient(transparent,#8b5cf6,transparent); }
    .core { width:58px; height:58px; border:1px solid rgba(139,92,246,.7); transform:rotate(45deg); display:grid; place-items:center; animation:pulse 2.2s infinite; }
    .core::after { content:""; width:9px; height:9px; border-radius:50%; background:#a78bfa; box-shadow:0 0 24px #8b5cf6; }
    @keyframes pulse { 50% { box-shadow:0 0 40px rgba(139,92,246,.38); transform:rotate(135deg) scale(1.08); } }
    .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .metric { padding:13px; border:1px solid rgba(255,255,255,.065); border-radius:12px; background:rgba(255,255,255,.025); }
    .metric b { display:block; font:600 17px 'Space Grotesk'; } .metric span { color:#737687; font-size:10px; text-transform:uppercase; letter-spacing:.1em; }
    .toast { position:fixed; left:50%; bottom:25px; z-index:30; padding:13px 18px; border:1px solid var(--line); border-radius:12px; background:#151722; box-shadow:0 18px 50px #0008; opacity:0; transform:translate(-50%,20px); pointer-events:none; transition:.3s; font-size:13px; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media (max-width:850px) { .status { display:none; } main { grid-template-columns:1fr; padding-top:75px; } .visual { max-width:520px; width:100%; margin:auto; } h1 { font-size:clamp(50px,15vw,76px); } }
    @media (max-width:520px) { nav,main { width:min(100% - 28px,1180px); } .login span:last-child { display:none; } .actions { flex-direction:column; } .download,.more { justify-content:center; } .panel { min-height:420px; } .crosshair { width:170px; height:170px; margin-top:55px; } }
  </style>
</head>
<body>
  <div class="orb one"></div><div class="orb two"></div>
  <nav>
    <div class="logo"><div class="logo-mark"><span>V</span></div>VOID</div>
    <div class="nav-right">
      <div class="status">Система работает</div>
      <button class="login" id="login"><span class="google">G</span><span>Войти через Google</span></button>
    </div>
  </nav>
  <main>
    <section>
      <div class="eyebrow">Новая версия · v1.0</div>
      <h1>CONTROL<br><span>THE GAME.</span></h1>
      <p class="lead">Технологичный инструмент для Rust с чистым интерфейсом, стабильной работой и быстрым запуском. Всё необходимое — без лишнего шума.</p>
      <div class="actions">
        <a class="button download" href="../кнопка.cpp/кнопка.exe" download="кнопка.exe" id="download">Скачать клиент <span>↓</span></a>
        <a class="button more" href="#details">Подробнее</a>
      </div>
    </section>
    <section class="visual" id="details">
      <div class="panel">
        <div class="panel-top"><span>VOID / CONTROL PANEL</span><div class="dots"><i></i><i></i><i></i></div></div>
        <div class="crosshair"><div class="core"></div></div>
        <div class="metrics">
          <div class="metric"><b>64 BIT</b><span>Architecture</span></div>
          <div class="metric"><b>1.0 MS</b><span>Response</span></div>
          <div class="metric"><b>ONLINE</b><span>Status</span></div>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    const toast = document.querySelector('#toast');
    const notify = text => { toast.textContent = text; toast.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => toast.classList.remove('show'), 2800); };
    document.querySelector('#download').addEventListener('click', () => notify('Загрузка началась'));
    document.querySelector('#login').addEventListener('click', () => notify('Google OAuth подключим после получения Client ID'));
  </script>
</body>
</html>
